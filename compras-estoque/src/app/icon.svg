<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Grupo Almeria">
  <!--
    Ícone da aba do navegador. O Next serve automaticamente `src/app/icon.svg`
    como favicon — não precisa de <link> no layout.

    NÃO É O LOGO DO GRUPO. É um monograma tirado da mesma marca que aparece no
    menu lateral ("Grupo Almeria"), nas cores do Controle de Vendas: fundo
    #6F1027, letra #F3EAD9. Serve pra tirar o globo cinza da aba enquanto o
    logo de verdade não entra — quando entrar, é trocar este arquivo e mais
    nada.

    O "A" é desenhado como TRAÇO, não como texto: favicon renderizado por
    fonte depende da fonte existir na máquina de quem abre, e a Inter não vai
    existir em todas. Traçado vetorial sai igual em qualquer lugar.

    Medido pra 16px, que é o tamanho real da aba: traço de 7.5/64 dá quase 2px
    cheios, e o vão do A continua aberto em vez de virar borrão.
  -->
  <rect width="64" height="64" rx="14" fill="#6F1027"/>
  <path d="M15 50 L32 14 L49 50"
        fill="none" stroke="#F3EAD9" stroke-width="7.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M22.5 38 H41.5"
        stroke="#F3EAD9" stroke-width="7" stroke-linecap="round"/>
</svg>
